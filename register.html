<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a GrowWell account.">
    <title>GrowWell | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-shell">
        <section class="login-card">
            <a class="login-brand" href="home.html" aria-label="GrowWell home">
                <img src="images/Logo.jpg" alt="GrowWell logo">
                <div>
                    <strong>GrowWell</strong>
                    <span>Join the community</span>
                </div>
            </a>

            <h1>Create your account</h1>
            <p>
                Set up a username and password, and the backend will store your account locally.
            </p>

            <form class="form-grid" data-register-form>
                <div class="field">
                    <label for="register-username">Username</label>
                    <input type="text" id="register-username" name="username" placeholder="Choose a username" autocomplete="username" required>
                </div>

                <div class="field">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" name="password" placeholder="Choose a password" autocomplete="new-password" required>
                </div>

                <button class="button button-primary" type="submit">Create account</button>
                <div class="login-message" data-register-message aria-live="polite"></div>
            </form>

            <div class="notice mt-20">
                After creating an account, you can sign in from the login page.
            </div>

            <div class="hero-actions login-actions">
                <a class="button button-secondary" href="login.html">Back to login</a>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
